---
quote_sent_confirmation:
  description: 'When a quote is marked as "Sent" in the field service platform for
    {business_name}, immediately send an SMS and email confirmation to the customer.
    Log quote details in the database and set up follow-up sequence timer based on
    quote value (Under $500: 3-touch over 5 days, $500-$2,000: 4-touch over 10 days,
    Over $2,000: 5-touch over 14 days with owner escalation)'
  expected_output: Confirmation messages sent via SMS and email, quote logged in database
    with follow-up schedule, customer added to appropriate follow-up sequence
  agent: quote_follow_up_specialist
job_completion_quality_check:
  description: 'When a job is marked as "Complete" for {business_name}, send immediate
    completion confirmation SMS within 1 hour, followed by a quality check SMS at
    24 hours asking for a 1-5 satisfaction rating. Route responses: 4-5 scores to
    review request track, 1-3 scores immediately flagged to owner with promised callback
    within 2 hours, no reply proceeds to review request after 48 hours.'
  expected_output: Completion confirmation sent, quality check rating collected, customer
    satisfaction scored and routed to appropriate next workflow (review request or
    problem resolution)
  agent: post_job_customer_experience_manager
seasonal_campaign_execution:
  description: Execute seasonal campaigns for {business_name} based on trade type
    and timing calendar. Send targeted messages 3-4 weeks BEFORE peak demand periods
    (e.g., HVAC tune-ups in late February, roofing inspections before spring storm
    season). Segment customers by last service type, date, and job value. Never send
    to customers who booked in last 60 days. Include direct booking links and reference
    previous services when possible.
  expected_output: Seasonal campaigns sent to appropriate customer segments at optimal
    timing, booking opportunities created before peak demand, customer engagement
    tracked
  agent: seasonal_campaign_manager
missed_call_response:
  description: Respond to every missed call for {business_name} within 5 minutes via
    SMS. Send immediate response acknowledging the missed call and asking how to help.
    Log call timestamp and response time. Send one follow-up if no reply within 2
    hours. Determine if inquiry is emergency based on keywords (flooding, no heat,
    sparking, etc.) and route accordingly with emergency contact information or standard
    follow-up promise.
  expected_output: Immediate SMS response sent for missed calls, emergency situations
    identified and routed appropriately, follow-up scheduled for non-responsive prospects
  agent: inbound_lead_capture_specialist
execute_follow_up_sequence:
  description: 'Execute the structured follow-up sequence for {business_name} based
    on quote value and timeline. Send Touch 1 (24 hours): helpful SMS check-in, Touch
    2 (3 days): email addressing common objections with testimonials and Accept Quote
    button, Touch 3 (5 days): urgency SMS about quote expiration. For high-value quotes
    (over $2,000), include Touch 4 (Day 10): personal SMS from owner and Touch 5 (Day
    14): final value summary with owner escalation flag.'
  expected_output: Follow-up messages sent according to schedule, customer responses
    tracked and routed appropriately, quotes marked as accepted/declined/expired based
    on customer interaction
  agent: quote_follow_up_specialist
  context:
  - quote_sent_confirmation
google_review_request_campaign:
  description: For satisfied customers (4-5 rating) of {business_name}, execute a
    targeted Google review request campaign. Send primary request at 3 days after
    job completion via SMS with direct Google review link. If no review posted, send
    one follow-up SMS at 7 days. After positive review or 21 days, send referral request
    offering referral credit for friends and family who book services.
  expected_output: Google review requests sent to qualified customers, direct review
    links provided, follow-up requests sent appropriately, referral opportunities
    created for satisfied customers
  agent: post_job_customer_experience_manager
  context:
  - job_completion_quality_check
lapsed_customer_re_engagement:
  description: Identify and re-engage customers of {business_name} who haven't booked
    services in 90+ days. Send targeted re-engagement messages referencing their last
    service and offering priority scheduling as returning customers. For customers
    with no response after 14 days, move to annual re-engagement only. Track all interactions
    to prevent over-messaging.
  expected_output: Lapsed customers identified and contacted with personalized re-engagement
    messages, response rates tracked, customers moved to appropriate follow-up schedules
  agent: seasonal_campaign_manager
  context:
  - seasonal_campaign_execution
web_form_and_lead_processing:
  description: Process all web form submissions and lead inquiries for {business_name}
    within 5 minutes. Send SMS confirmation referencing their specific service inquiry
    and email with next steps timeline. Add leads to quote pipeline and alert owner
    for follow-up within 24 hours. Differentiate between emergency and standard requests
    based on service type and keywords.
  expected_output: Web leads acknowledged immediately via SMS and email, leads added
    to appropriate pipeline, owner alerted for timely follow-up, emergency situations
    fast-tracked
  agent: inbound_lead_capture_specialist
  context:
  - missed_call_response
customer_workflow_coordination:
  description: Monitor and coordinate all customer interactions across agents for
    {business_name}. Ensure one customer receives messages from only one active workflow
    at a time. Enforce quiet hours (no SMS 8PM-9AM local time) and 3 SMS maximum per
    7-day window. Track negative signals and pause all automation when customer issues
    are flagged. Route customers between appropriate agent workflows based on their
    status and interactions.
  expected_output: Customer workflows properly coordinated, no duplicate messaging,
    quiet hours enforced, negative feedback properly escalated, smooth handoffs between
    agent workflows
  agent: tradespulse_operations_manager
  context:
  - quote_sent_confirmation
  - job_completion_quality_check
  - seasonal_campaign_execution
  - missed_call_response
weekly_business_intelligence_report:
  description: Generate and deliver comprehensive weekly business intelligence report
    for {business_name} every Monday morning. Include quote follow-up performance,
    jobs completed, review requests vs received reviews, average customer satisfaction
    scores, seasonal campaign results, lead response times, referral credits issued,
    and estimated new business value from reviews. Provide actionable insights and
    recommendations for improvement.
  expected_output: Comprehensive weekly report delivered to business owner with key
    performance metrics, trend analysis, and actionable recommendations for optimizing
    customer acquisition and retention
  agent: tradespulse_operations_manager
  context:
  - execute_follow_up_sequence
  - google_review_request_campaign
  - lapsed_customer_re_engagement
  - web_form_and_lead_processing
  - customer_workflow_coordination
